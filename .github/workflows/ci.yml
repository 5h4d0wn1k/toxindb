name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The interpreter range we actually claim to support. README says 3.10+ and
  # the trove classifiers list 3.10-3.13; this matrix is what makes those
  # claims true rather than aspirational. Previously only 3.11 was ever
  # exercised, so three of the four supported versions were untested.
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # A heuristic that stops firing is the worst regression this project can have,
  # and nothing about that is visible from a passing suite alone. The coverage
  # gate is what turns "the tests pass" into "the detection logic is still
  # being exercised".
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage gate
        run: python -m pytest tests/ --cov --cov-report=term-missing

  # Correctness-critical lint only. See [tool.ruff.lint] in pyproject.toml for
  # why the gate is scoped this narrowly and how to widen it.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.1"
      - name: Ruff check
        run: ruff check toxindb/ tests/
      - name: Ruff format check
        # Informational for now: the tree has never been formatted with ruff,
        # so this reports rather than blocks. Flip to a hard gate once the
        # formatting pass lands, same as the lint ratchet.
        run: ruff format --check toxindb/ tests/ || echo "::notice::ruff format is not yet enforced; run 'ruff format' as a dedicated pass"

  # The README is the project's primary interface, and the test suite never
  # reads it, so doc rot is invisible to every other job here. This job parses
  # the fenced bash blocks out of README.md and actually runs them.
  docs:
    name: docs commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Execute every documented command
        run: python .github/scripts/check_docs_commands.py

  # The demo is the first thing a new user runs. It must stay deterministic
  # and offline, so the build job also asserts both of those properties.
  demo:
    name: demo (offline, deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run demo twice and require identical output
        # Determinism is a documented promise of the bundled fixtures. If the
        # demo ever starts depending on wall-clock time, set iteration order or
        # sampling, this is where it shows up rather than in a user's report.
        # generated_at is excluded, since it is report metadata, not a result.
        run: python .github/scripts/check_demo_determinism.py "${RUNNER_TEMP}/det"
      - name: Prove the determinism gate can actually fail
        # A gate nobody has watched reject bad input is not a gate. This
        # deliberately injects five kinds of nondeterminism into throwaway
        # copies of the tree and asserts the check above rejects each one, then
        # injects the two cases it is *meant* to absorb and asserts it does not
        # reject those. Without this, a normaliser that accidentally swallows
        # everything would leave the build green while proving nothing.
        run: python .github/scripts/check_gate_teeth.py
      - name: Assert the core makes no network calls
        # SCOPE.md and the README both promise "zero network calls". This is
        # the one place that promise could silently be broken by a future
        # dependency, so it is checked rather than trusted.
        run: |
          set -euo pipefail
          if grep -rnE '^\s*(import|from)\s+(socket|ssl|http|urllib|requests|ftplib|smtplib|telnetlib|asyncio)\b' toxindb/ ; then
            echo "::error::the stdlib-only, offline core must not import network modules"
            exit 1
          fi
          echo "no network imports in toxindb/"

  # Guards the packaging metadata itself, independent of the source tree.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify the wheel exposes the console script
        run: |
          set -euo pipefail
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl
          /tmp/wheelcheck/bin/toxindb --help
          echo "wheel installs and the console script runs"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
