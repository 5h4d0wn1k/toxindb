name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The interpreter range we actually claim to support. README says 3.10+ and
  # the trove classifiers list 3.10-3.13; this matrix is what makes those
  # claims true rather than aspirational. Previously only 3.11 was ever
  # exercised, so three of the four supported versions were untested.
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # A heuristic that stops firing is the worst regression this project can have,
  # and nothing about that is visible from a passing suite alone. The coverage
  # gate is what turns "the tests pass" into "the detection logic is still
  # being exercised".
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage gate
        # The threshold is passed here rather than set in [tool.coverage.report]
        # so that it applies to the CI gate only. A contributor running
        # `pytest tests/test_one.py --cov` to debug one module should not get a
        # failing exit code for having low coverage on purpose.
        run: python -m pytest tests/ --cov --cov-report=term-missing --cov-fail-under=95

  # Correctness-critical lint only. See [tool.ruff.lint] in pyproject.toml for
  # why the gate is scoped this narrowly and how to widen it.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.1"
      - name: Ruff check
        # .github/scripts/ is linted too: the three gates this PR adds are
        # ordinary Python and a gate with a typo should fail the build that
        # introduces it, not the next one.
        run: ruff check toxindb/ tests/ .github/scripts/
      - name: Ruff format check
        # Informational for now: the tree has never been formatted with ruff,
        # so this reports rather than blocks. Flip to a hard gate once the
        # formatting pass lands, same as the lint ratchet.
        run: ruff format --check toxindb/ tests/ .github/scripts/ || echo "::notice::ruff format is not yet enforced; run 'ruff format' as a dedicated pass"

  # The README is the project's primary interface, and the test suite never
  # reads it, so doc rot is invisible to every other job here. This job parses
  # the fenced bash blocks out of README.md and actually runs them.
  docs:
    name: docs commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (non-editable, on purpose)
        # NOT `pip install -e .`. `toxindb demo` regenerates its fixtures via
        # `trace_gen.get_traces_dir()`, which resolves relative to the package
        # directory. Under an editable install that is the checkout, so the
        # demo writes into the tree this job is supposed to be leaving alone --
        # invisibly, because the regenerated bytes happen to match what is
        # committed.
        #
        # A virtualenv inside the checkout would put site-packages back under
        # the repository and reintroduce the same problem, so Guard 2 of
        # check_docs_commands.py refuses to run in that configuration and names
        # which cause it detected. Three independent layers: this install
        # choice, that guard, and a per-command `git status` comparison that
        # also covers gitignored paths (a planted canary is one, and this PR
        # adds `*_canary_planted.jsonl` to .gitignore).
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Execute every documented command
        run: python .github/scripts/check_docs_commands.py
      - name: Prove the docs gate can actually fail
        # A gate nobody has watched reject bad input is not a gate. The
        # determinism gate has its teeth tested; the docs gate did not, and it
        # is the one that had four holes found by reading the code rather than by
        # a failing test: a trailing `&` reported PASS with exit 0, `$(...)` was
        # executed by /bin/sh, an unterminated fence printed `::error::` and
        # still exited 0, and `env`/`nohup`/`timeout`/`NAME=value` wrappers were
        # silently skipped so the job passed with nonexistent subcommands
        # unverified. Each is a case below.
        #
        # This step also found a fifth defect that reading the code had missed:
        # the closing ``` of a `python`/`json` block was parsed as the *opening*
        # of a new unlabelled block, so any document containing one non-shell
        # example was reported as having an unterminated fence. The shipped
        # README contains no non-shell fences, which is the only reason it had
        # never fired.
        #
        # It runs in this job on purpose: the cases invoke toxindb, so it needs
        # the same non-editable install Guard 2 insists on.
        run: python .github/scripts/check_docs_teeth.py

  # The demo is the first thing a new user runs. It must stay deterministic
  # and offline, so the build job also asserts both of those properties.
  demo:
    name: demo (offline, deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run demo twice and require identical output
        # Determinism is a documented promise of the bundled fixtures. If the
        # demo ever starts depending on wall-clock time, set iteration order or
        # sampling, this is where it shows up rather than in a user's report.
        #
        # This job installs editable on purpose: `python -m toxindb` puts the
        # working directory first on sys.path, and check_gate_teeth.py below
        # injects its mutations into a *copy* of the tree that only takes
        # effect if the copy is what gets imported. Running it this way also
        # means `trace_gen.get_traces_dir()` resolves to the checkout, so the
        # demo *could* write into the tree the script is guarding; the script
        # asserts that it does not. In practice `ensure_demo_traces()` skips
        # every fixture that already exists, so nothing is written -- which is
        # why that assertion is a safety net rather than a tripwire.
        run: python .github/scripts/check_demo_determinism.py "${RUNNER_TEMP}/det"
      - name: Prove the determinism gate can actually fail
        # A gate nobody has watched reject bad input is not a gate. This
        # injects ten kinds of nondeterminism into throwaway copies of the tree
        # and asserts the check above reports each as a real difference rather
        # than merely exiting non-zero, then injects the one case it is
        # *meant* to absorb and asserts it stays green, then asserts a
        # deterministic crash is not mistaken for a detection, then calls the
        # normaliser directly to pin down exactly what it does and does not
        # absorb. Without the first two, a normaliser that swallowed everything
        # would leave the build green while proving nothing; without the third,
        # a mutation that merely broke the demo would score as a pass.
        run: python .github/scripts/check_gate_teeth.py
      - name: Assert the core makes no network calls
        # SCOPE.md and the README both promise "zero network calls". This is the
        # one place that promise could silently be broken by a future
        # dependency, so it is checked rather than trusted.
        #
        # This used to be a `grep -E` anchored at the start of an import
        # statement, which required the network module to be the first name on
        # the line. `import os, socket`, `import json, urllib.request` and a
        # parenthesised `from x import (\n    ssl,\n)` all passed it -- verified,
        # exit 0 over a module that imports socket. An `ast` walk collects every
        # alias of every import node, so the formatting of the source stops
        # mattering.
        #
        # `--self-test` runs in the same step, not in a separate one, because a
        # separate script is one more thing that can quietly stop running. It
        # proves the scanner rejects the shapes above and accepts lookalikes
        # (`socket_helpers`, `sockets`, a path in a string) before the real
        # scan, so a scanner that rejected everything could not pass.
        run: python .github/scripts/check_no_network.py --self-test toxindb

  # Guards the packaging metadata itself, independent of the source tree.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify the wheel exposes the console script
        run: |
          set -euo pipefail
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl
          /tmp/wheelcheck/bin/toxindb --help
          echo "wheel installs and the console script runs"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
